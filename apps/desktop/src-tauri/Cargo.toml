[package]
name = "dossier-desktop"
version = "0.1.0"
description = "Dossier desktop kernel"
authors = ["Dossier"]
edition = "2024"

[lib]
name = "dossier_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.2" }

[dependencies]
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.5" }
tauri-plugin-dialog = "2.4.0"
uuid = { version = "1.18.1", features = ["v4"] }

[dev-dependencies]
tempfile = "3.23.0"
